name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check sample benchmark
        run: python -m agentbench --candidate examples/candidates/fixed.py --trace examples/traces/fixed.json --output reports/agentic.json
      - name: Check human ratings
        run: python -m rubriclab validate

