[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-coding-eval"
version = "0.1.0"
description = "A reproducible coding-agent benchmark and human evaluation workbench"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Portfolio project contributor"}]
dependencies = []

[project.scripts]
rubriclab = "rubriclab.cli:main"
agentbench = "agentbench.cli:main"

[tool.setuptools.packages.find]
include = ["rubriclab*", "agentbench*"]

